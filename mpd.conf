music_directory    "/music"
playlist_directory "/var/lib/mpd/playlists"
db_file            "/var/lib/mpd/mpd.db"
log_file           "/var/log/mpd/mpd.log"
pid_file           "/run/mpd/mpd.pid"
state_file         "/var/lib/mpd/mpdstate"

user               "mpd"
group              "audio"

bind_to_address    "0.0.0.0"
port               "6600"

# Встроенный HTTP-стрим
audio_output {
    type            "httpd"
    name            "Radio Stream"
    encoder         "vorbis"            # можно "lame" для mp3
    port            "8000"
    bitrate         "128000"
    format          "44100:16:2"
    max_clients     "50"
    always_on       "yes"
    tags            "yes"
}

# Кроссфейд 5 секунд и gapless
playlist {
    gapless_mp3_playback           "yes"
    gapless_mp3_playback_prebuffer "20"
    crossfade                      "5"
}

auto_update    "yes"
