# Основные настройки MPD
music_directory    "/music"
playlist_directory "/var/lib/mpd/playlists"
db_file            "/var/lib/mpd/mpd.db"
log_file           "/var/log/mpd/mpd.log"
pid_file           "/run/mpd/mpd.pid"
state_file         "/var/lib/mpd/mpdstate"

user               "mpd"
group              "audio"

bind_to_address    "0.0.0.0"
port               "6600"

# Аудиовыход – наш HTTP-стрим (Icecast-совместимый)
audio_output {
    type       "httpd"
    name       "Super Radio"
    encoder    "vorbis"          # Vorbis (ogg), можно "lame" для mp3
    port       "8000"
    bitrate    "128000"          # 128 kbps
    format     "44100:16:2"      # стерео 44.1 кГц
    max_clients "50"
}
