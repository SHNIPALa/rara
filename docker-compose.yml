version: '3.8'

services:
  radio-bot:
    build: .
    container_name: super-radio
    restart: unless-stopped
    ports:
      - "8080:8080"   # Поток
      - "4040:4040"   # Ngrok статус
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
    volumes:
      - ./music:/app/music
    stdin_open: true
    tty: true
