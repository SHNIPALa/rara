version: '3.8'
services:
  mpd:
    image: ghcr.io/music-player-daemon/mpd:latest
    container_name: mpd-radio
    restart: unless-stopped
    volumes:
      - ./mpd.conf:/etc/mpd.conf
      - ./music:/music
      - mpd-data:/var/lib/mpd
    ports:
      - "6600:6600"    # только для локального управления
    depends_on:
      - icecast  # ждём icecast
    command: mpd --no-daemon /etc/mpd.conf

  icecast:
    image: infiniteproject/icecast:latest
    container_name: icecast-radio
    restart: unless-stopped
    volumes:
      - ./icecast.xml:/etc/icecast2/icecast.xml
    ports:
      - "8000:8000"   # Icecast stream + web admin
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme
      - ICECAST_ADMIN_PASSWORD=hackme

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: radio-bot
    restart: unless-stopped
    volumes:
      - ./music:/music   # общая папка с mpd
    environment:
      - TELEGRAM_BOT_TOKEN=8726694308:AAF5_WwE1Tu9csG7ZKjwgG50n-1A5nByM4Q
      - ADMIN_IDS=1816361127
      - PUBLIC_URL=${PUBLIC_URL}                      # сюда подставим туннельный URL
      - MPD_HOST=mpd
      - MPD_PORT=6600
      - MUSIC_DIR=/music
    depends_on:
      - mpd
cloudpub:
    image: ermakdev/cloudpub-client:latest
    container_name: radio-cloudpub
    restart: unless-stopped
    environment:
      - CLOUDPUB_TOKEN=${CLOUDPUB_TOKEN}   # берём токен из .env
    command: http icecast:8000
    depends_on:
      - icecast

volumes:
  mpd-data:


