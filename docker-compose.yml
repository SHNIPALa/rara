version: '3.8'
services:
  radio:
    build: .
    container_name: radio-mini
    restart: unless-stopped
    volumes:
      - ./music:/app/music
    environment:
      - TELEGRAM_BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - PUBLIC_URL=${PUBLIC_URL}
    ports:
      - "8080:8080"   # локально можно смотреть

  cloudpub:
    image: ermakdev/cloudpub-client:latest
    container_name: radio-mini-cloudpub
    restart: unless-stopped
    environment:
      - CLOUDPUB_TOKEN=${CLOUDPUB_TOKEN}
    command: http radio:8080   # туннель на наш radio-сервис
    depends_on:
      - radio

