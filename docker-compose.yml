version: '3.8'
services:
  mpd:
    image: ghcr.io/music-player-daemon/mpd:latest
    container_name: mpd-radio
    restart: unless-stopped
    volumes:
      - ./mpd.conf:/etc/mpd.conf
      - ./music:/music
      - mpd-data:/var/lib/mpd
    ports:
      - "6600:6600"
      - "8000:8000"
    command: mpd --no-daemon /etc/mpd.conf

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: radio-bot
    restart: unless-stopped
    volumes:
      - ./music:/music
    environment:
      - TELEGRAM_BOT_TOKEN=8726694308:AAF5_WwE1Tu9csG7ZKjwgG50n-1A5nByM4Q
      - ADMIN_IDS=1816361127
      - PUBLIC_URL=https://ваш-туннель-адрес/mpd.ogg
      - MPD_HOST=mpd
      - MPD_PORT=6600
      - MUSIC_DIR=/music
    depends_on:
      - mpd

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: radio-cf
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://mpd:8000
    depends_on:
      - mpd

volumes:
  mpd-data:
