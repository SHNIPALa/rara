version: '3.8'
services:
  # ------------------------------------------------------------
  # Мини-радио (бот + HTTP-сервер)
  # ------------------------------------------------------------
  radio:
    build: .
    container_name: radio-mini
    restart: unless-stopped
    network_mode: host            # чтобы cloudpub мог достучаться до localhost:8080
    volumes:
      - ./music:/app/music
      - ./shared:/shared          # общая папка для URL-файла

  # ------------------------------------------------------------
  # Агент CloudPub (строго как вы просили, но с сохранением вывода)
  # ------------------------------------------------------------
  cloudpub:
    image: cloudpub/cloudpub:latest
    container_name: radio-mini-cloudpub
    restart: unless-stopped
    network_mode: host            # чтобы видеть порт 8080 на хосте
    environment:
      - TOKEN=${CLOUDPUB_TOKEN}   # ваш токен
    # Команда почти как вы хотели: publish http 8080, но с tee для получения URL
    command: sh -c "cloudpub publish http 8080 2>&1 | tee /shared/cloudpub_url.txt"
    volumes:
      - ./shared:/shared          # чтобы записать файл с URL
