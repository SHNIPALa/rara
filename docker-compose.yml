version: '3.8'
services:
  # ------------------------------------------------------------
  # 1. Мини-радио (бот + плеер + поток)
  # ------------------------------------------------------------
  radio:
    build: .
    container_name: radio-mini
    restart: unless-stopped
    volumes:
      - ./music:/app/music
      - ./shared:/shared          # <-- общая папка для URL
    environment:
      - TELEGRAM_BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      # PUBLIC_URL оставляем пустым, бот сам найдёт адрес
      - PUBLIC_URL=
    expose:
      - "8080"

  # ------------------------------------------------------------
  # 2. Официальный агент CloudPub с сохранением вывода в файл
  # ------------------------------------------------------------
  cloudpub:
    image: cloudpub/cloudpub:latest
    container_name: radio-mini-cloudpub
    restart: unless-stopped
    environment:
      - TOKEN=${CLOUDPUB_TOKEN}
      - HTTP=radio:8080
    # Перенаправляем весь вывод агента в файл, доступный radio
    command: sh -c "cloudpub run > /shared/cloudpub_url.txt 2>&1"
    depends_on:
      - radio
    volumes:
      - ./shared:/shared

# Для хранения файла с URL (можно и без тома, т.к. папка ./shared уже на хосте)
volumes: {}
