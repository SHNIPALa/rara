version: '3.8'
services:
  mpd:
    image: vimagick/mpd
    container_name: mpd-radio
    restart: unless-stopped
    volumes:
      - ./mpd.conf:/etc/mpd.conf
      - ./music:/music
      - mpd-data:/var/lib/mpd
    ports:
      - "6600:6600"   # управление (не обязательно наружу)
      - "8000:8000"   # HTTP-поток
    command: mpd --no-daemon /etc/mpd.conf

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radio-bot
    restart: unless-stopped
    volumes:
      - ./music:/music
    environment:
      - TELEGRAM_BOT_TOKEN=ваш_токен
      - ADMIN_IDS=123456789
      - PUBLIC_URL=https://ваш-туннель-адрес/mpd.ogg
      - MPD_HOST=mpd
      - MPD_PORT=6600
      - MUSIC_DIR=/music
    depends_on:
      - mpd

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: radio-cf
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://mpd:8000
    # Для постоянного домена замените на команду с токеном
    depends_on:
      - mpd

volumes:
  mpd-data:
