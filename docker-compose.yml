version: '3.8'
services:
  radio:
    build: .
    container_name: super-radio
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./music:/app/music
      - ./data:/app/data
      - ./pending:/app/pending
      - ./radio.log:/app/radio.log
    environment:
      - TELEGRAM_BOT_TOKEN=ваш_токен_бота
      - ADMIN_IDS=123456789
      - TUNNEL_SERVICE=localhost   # localhost, ngrok, cloudflare
      - PORT=8080
      # Если выбран ngrok, укажите токен:
      # - NGROK_AUTH_TOKEN=токен_ngrok
      # Если cloudflare с постоянным туннелем:
      # - CLOUDFLARE_TUNNEL_NAME=имя_туннеля
      # Чтобы использовать готовый URL без туннеля:
      # - PUBLIC_URL=https://your-domain.com
