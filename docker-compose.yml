version: '3.8'
services:
  radio:
    build: .
    container_name: super-radio
    restart: unless-stopped
    volumes:
      - ./music:/app/music
      - ./pending:/app/pending
      - ./data:/app/data
    environment:
      - TELEGRAM_BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - PORT=8080
      - MUSIC_FOLDER=/app/music
      - PENDING_FOLDER=/app/pending
      - DATA_FOLDER=/app/data
